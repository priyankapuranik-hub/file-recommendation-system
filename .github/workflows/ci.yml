name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build --tag file-recommendation-system:${{ github.sha }} .
      - run: docker run --detach --name recommendation-ci --publish 3000:3000 file-recommendation-system:${{ github.sha }}
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost:3000/health
      - if: always()
        run: docker logs recommendation-ci || true
      - if: always()
        run: docker rm --force recommendation-ci || true
