services:
  file-recommendation:
    build:
      context: .
    image: ${IMAGE_NAME:-file-recommendation-system}:${APP_VERSION:-latest}
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-local}
      DATA_DIR: /app/data
    volumes:
      - ${HOST_DATA_DIR:-./sample-data}:/app/data:ro
      - ${HOST_STORAGE_DIR:-./storage}:/app/storage
    restart: unless-stopped
