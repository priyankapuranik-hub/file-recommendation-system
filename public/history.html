<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FileFind — Opened Files</title>
  <style>
    :root { color-scheme: dark; --ink: #edf4ff; --muted: #9caec8; --line: #9ab4e233; --panel: #141f39bd; }
    * { box-sizing: border-box; }
    body { font: 16px/1.5 Inter, system-ui, sans-serif; min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(circle at 15% 10%, #263c70, transparent 35%), #090f20; }
    main { max-width: 980px; margin: auto; padding: 3rem 1.25rem; }
    a { color: #9ff8ed; } .top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    h1 { margin: .3rem 0; font-size: clamp(2rem, 5vw, 3.6rem); letter-spacing: -.05em; } .intro { color: var(--muted); }
    .back { padding: .6rem .9rem; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; background: #ffffff0d; white-space: nowrap; }
    #history { display: grid; gap: .9rem; } .item { padding: 1.1rem 1.25rem; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 14px 35px #0003; }
    .filename { font-size: 1.1rem; font-weight: 700; } .detail { margin-top: .25rem; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
    .query { display: inline-block; margin-top: .75rem; padding: .25rem .55rem; border-radius: 999px; color: #d9d4ff; background: #7c6cff33; font-size: .82rem; }
    .empty { padding: 2rem; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); text-align: center; }
    @media (max-width: 600px) { .top { display: block; } .back { display: inline-block; margin-top: 1rem; } }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div><a href="/">← Back to search</a><h1>Opened files</h1><div class="intro">A clear history of files opened from FileFind.</div></div>
    <a class="back" href="/history">Refresh history</a>
  </div>
  <section id="history" aria-live="polite"><div class="empty">Loading history…</div></section>
</main>
<script>
  async function loadHistory() {
    const container = document.querySelector("#history");
    try {
      const response = await fetch("/api/history");
      const data = await response.json();
      if (!response.ok || !data.files.length) {
        container.innerHTML = '<div class="empty">No files have been opened yet.</div>';
        return;
      }
      container.replaceChildren(...data.files.map((file) => {
        const item = document.createElement("article");
        item.className = "item";
        const filename = document.createElement("div");
        filename.className = "filename";
        filename.textContent = file.filename;
        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent = `${file.file_path} · ${new Date(file.opened_at).toLocaleString()}`;
        const query = document.createElement("span");
        query.className = "query";
        query.textContent = `Search: ${file.search_query || "direct open"}`;
        item.append(filename, detail, query);
        return item;
      }));
    } catch (_error) {
      container.innerHTML = '<div class="empty">History is temporarily unavailable.</div>';
    }
  }
  loadHistory();
</script>
</body>
</html>
