<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>File Recommendation System</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #172033; }
    form { display: flex; gap: .5rem; } input { flex: 1; padding: .7rem; } button { padding: .7rem 1rem; }
    li { margin: .7rem 0; } .score { color: #53657d; }
  </style>
</head>
<body>
  <h1>File Recommendation System</h1>
  <p>Search the files mounted in the application data directory.</p>
  <form id="search"><input id="query" placeholder="e.g. deployment guide" required><button>Recommend</button></form>
  <ul id="results"></ul>
  <script>
    document.querySelector("#search").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch(`/api/recommend?q=${encodeURIComponent(document.querySelector("#query").value)}`);
      const data = await response.json();
      document.querySelector("#results").innerHTML = response.ok
        ? data.results.map((r) => `<li><strong>${r.filename}</strong> (${r.path}) <span class="score">${(r.similarity_score * 100).toFixed(0)}%</span></li>`).join("") || "<li>No matches found.</li>"
        : `<li>${data.error}</li>`;
    });
  </script>
</body>
</html>
